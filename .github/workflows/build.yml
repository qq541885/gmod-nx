name: build-gmod-nx

# 在 GitHub 的 runner 上编译，绕开本地无法访问 pkg.devkitpro.org 的问题。
# runner 在境外，能正常拉 devkitPro 的包；容器镜像 devkitpro/devkita64 自带
# 完整的 aarch64-none-elf 工具链和 libnx。
#
# 注意：容器作业用 `bash --noprofile --norc` 运行，会跳过 /etc/profile，
# 所以 PATH 里默认没有 /usr/bin，pacman 会 command not found。这里显式给出 PATH。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/pacman/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DEVKITPRO: /opt/devkitpro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe environment
        run: |
          set -uo pipefail
          echo "PATH=$PATH"
          echo "DEVKITPRO=${DEVKITPRO:-<unset>}"
          echo "--- /opt ---"
          ls -1 /opt 2>/dev/null || true
          echo "--- tools ---"
          command -v pacman     || echo "no pacman"
          command -v dkp-pacman || echo "no dkp-pacman"
          command -v aarch64-none-elf-gcc || echo "no gcc"
          echo "--- libnx ---"
          ls -1 /opt/devkitpro 2>/dev/null || true
          ls -1 /opt/devkitpro/libnx 2>/dev/null || true

      - name: Install Switch portlibs
        run: |
          set -euo pipefail
          PM="$(command -v dkp-pacman || command -v pacman || true)"
          if [ -z "$PM" ]; then
            echo "::error::找不到 pacman，容器镜像结构与预期不同"
            ls -R /opt 2>/dev/null | head -50
            exit 1
          fi
          echo "using $PM"
          "$PM" -Sy --noconfirm --needed
          "$PM" -S  --noconfirm --needed \
            switch-sdl2 \
            switch-sdl2_image \
            switch-mesa \
            switch-libdrm_nouveau \
            switch-zlib \
            switch-ffmpeg
          echo "--- verify ---"
          aarch64-none-elf-gcc --version | head -1
          ls -l "$DEVKITPRO/libnx/switch_rules"

      - name: Build
        run: |
          set -euo pipefail
          make -j"$(nproc)" 2>&1 | tee build.log
          echo "--- output ---"
          ls -la *.nro *.elf *.nacp 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload NRO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gmod_nx-nro
          path: |
            gmod_nx.nro
            gmod_nx.elf
            gmod_nx.nacp
          if-no-files-found: error
