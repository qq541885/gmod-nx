name: build-gmod-nx

# 在 GitHub 的 runner 上编译，绕开本地无法访问 pkg.devkitpro.org 的问题。
#
# 两个环境坑（都已踩过）：
#  1. 容器作业用 `bash --noprofile --norc` 运行，跳过 /etc/profile，
#     默认 PATH 里没有 /usr/bin —— 必须显式给 PATH。
#  2. devkitpro/devkita64 里工具链在 $DEVKITPRO/devkitA64/bin，
#     不在 $DEVKITPRO/tools/bin ；pacman 在 $DEVKITPRO/pacman/bin。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      PATH: /opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/pacman/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe environment
        run: |
          set -uo pipefail
          echo "PATH=$PATH"
          echo "DEVKITPRO=$DEVKITPRO"
          echo "--- devkitA64/bin ---"
          ls -1 "$DEVKITPRO/devkitA64/bin" 2>/dev/null | head -20 || echo "(empty or missing)"
          echo "--- tools ---"
          command -v aarch64-none-elf-gcc || echo "no gcc"
          command -v pacman || echo "no pacman"
          echo "--- installed switch packages ---"
          pacman -Q 2>/dev/null | grep -E '^(switch|libnx|devkit)' | head -20 || echo "(none)"
          echo "--- portlibs ---"
          ls -1 "$DEVKITPRO/portlibs/switch/lib" 2>/dev/null | head -20 || echo "(none)"

      - name: Install Switch portlibs
        run: |
          set -euo pipefail
          PM="$(command -v pacman || command -v dkp-pacman || true)"
          if [ -z "$PM" ]; then echo "::error::pacman not found"; exit 1; fi
          echo "using $PM"
          "$PM" -Sy --noconfirm --needed 2>&1 | tail -5
          for pkg in switch-sdl2 switch-sdl2_image switch-mesa switch-libdrm_nouveau switch-zlib switch-ffmpeg; do
            if "$PM" -Q "$pkg" >/dev/null 2>&1; then
              echo "already installed: $pkg"
            else
              echo "installing: $pkg"
              "$PM" -S --noconfirm --needed "$pkg" 2>&1 | tail -3 || echo "::warning::failed to install $pkg"
            fi
          done
          echo "--- verify ---"
          aarch64-none-elf-gcc --version | head -1
          ls -l "$DEVKITPRO/libnx/switch_rules"

      - name: Build
        run: |
          set -euo pipefail
          make -j"$(nproc)" 2>&1 | tee build.log
          echo "--- output ---"
          ls -la *.nro *.elf *.nacp 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload NRO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gmod-nx-nro
          path: |
            *.nro
            *.elf
            *.nacp
          if-no-files-found: error
