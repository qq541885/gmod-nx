name: build-gmod-nx

# 在 GitHub 的 runner 上编译，绕开本地无法访问 pkg.devkitpro.org 的问题。
# runner 在境外，能正常拉 devkitPro 的包；容器镜像 devkitpro/devkita64 自带
# 完整的 aarch64-none-elf 工具链和 libnx。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Switch portlibs
        run: |
          set -euo pipefail
          # 容器里已配好 dkp-libs / dkp-win32 仓库，直接装 Switch 侧依赖
          pacman -Sy --noconfirm --needed
          pacman -S --noconfirm --needed \
            switch-sdl2 \
            switch-sdl2_image \
            switch-mesa \
            switch-libdrm_nouveau \
            switch-zlib \
            switch-ffmpeg
          echo "--- toolchain ---"
          echo "DEVKITPRO=$DEVKITPRO"
          aarch64-none-elf-gcc --version | head -1
          ls "$DEVKITPRO/libnx/switch_rules"

      - name: Build
        run: |
          set -euo pipefail
          make -j"$(nproc)" 2>&1 | tee build.log
          echo "--- output ---"
          ls -la *.nro *.elf *.nacp 2>/dev/null || true

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload NRO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gmod_nx-nro
          path: |
            gmod_nx.nro
            gmod_nx.elf
            gmod_nx.nacp
          if-no-files-found: error
